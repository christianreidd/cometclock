<!DOCTYPE html>
<html lang="en">
    <head>
            <link rel="stylesheet" href="style.css">
            <meta charset="UTF-8">
            <meta name="viewport" content="width=0, initial-scale=1.0">
            <button onClick="lightMode()" type="button" id="lightMode">🌕</button>
            <title>cometclock 💫</title>
    </head>
    <body>
        <h1>cometclock 💫</h1>
        <h2 id="tasks">tasks</h2>
        <div class="controls">
            <button onClick="addAssignmentButtonClicked()" type="button">Add Assignment</button>
            <button onClick="exportTasks()" type="button">Export Tasks</button>
            <button onClick="document.getElementById('importFile').click()" type="button">Import Tasks</button>
            <input id="importFile" type="file" accept="application/json" style="display:none" />
            <label for="sortMode">Sort:</label>
            <select id="sortMode">
                <option value="due-asc">Due date (soonest first)</option>
                <option value="due-desc">Due date (latest first)</option>
                <option value="name-asc">Name (A-Z)</option>
                <option value="name-desc">Name (Z-A)</option>
                <option value="created-asc">Date created (oldest first)</option>
                <option value="created-desc">Date created (newest first)</option>
            </select>
        </div>
        <div id="taskList"></div>

        <div id="creationWindow" class="modal">
            <div class="modal-content">
                <h3>Create Task</h3>

                <label for="nameInput">Task Name</label>
                <input id="nameInput" type="text" placeholder="Task Name">

                <label for="dueDate">Due Date</label>
                <input id="dueDate" type="date" placeholder="Due Date">

                <label for="dueTime">Due Time</label>
                <input id="dueTime" type="time" placeholder="Time Due">

                <div class="modal-actions">
                    <button onClick="createTask()" type="button">Create</button>
                    <button onClick="closeCreateTaskModal()" type="button">Cancel</button>
                </div>
            </div>
        </div>

        <div id="taskModal" class="modal">
            <div class="modal-content">
                <h3>Task Details</h3>

                <label for="modalTaskName">Task Name</label>
                <input id="modalTaskName" type="text" placeholder="Task Name">

                <label for="modalDueDate">Due Date</label>
                <input id="modalDueDate" type="date">

                <label for="modalDueTime">Due Time</label>
                <input id="modalDueTime" type="time">

                <label for="modalTaskNotes">Notes</label>
                <textarea id="modalTaskNotes" placeholder="Add Notes Here..."></textarea>

                <label class="checkbox-row" for="modalCompleted">
                    <input id="modalCompleted" type="checkbox">
                    Complete
                </label>

                <div class="modal-actions">
                    <button type="button" onClick="saveTaskEdits()">Save</button>
                    <button type="button" onClick="deleteSelectedTask()">Delete</button>
                    <button type="button" onClick="closeTaskModal()">Close</button>
                </div>
            </div>
        </div>

        <p id="tag">made with ❤️ by christian reid</p>
        <script src="script.js"></script>
    </body>
</html>
